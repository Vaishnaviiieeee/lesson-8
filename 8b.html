<!DOCTYPE html>
<html>
<head>
    <title>Exercise 8b</title>
    <style>
        .box {
            width: 500px;
            padding: 15px;
            border: 1px solid #ccc;
        }
        p {
            display: inline-block;
            width: 350px;
            vertical-align: middle;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        button {
            display: inline-block;
            width: 50px;
            vertical-align: middle;
            padding: 8px 0;
            margin-left: 5px;
            border: 1px solid #999;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>Thanks for chatting with our customer support. Would you like to take our quick survey?</p>
        <button>Yes</button>
        <button>No</button>
    </div>
</body>
</html>
